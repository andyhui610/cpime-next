[package]
name = "cpime-core"
version = "0.1.0"
edition = "2021"
description = "Cross-Platform Cantonese & English-Lookup IME Core Engine"

[lib]
name = "cpime_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "repl"
path = "src/bin/repl.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

