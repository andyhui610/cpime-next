name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test-and-build:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Generate seed lexicon database for tests
        run: python tools/init_seed_db.py

      - name: Run workspace unit and integration tests
        run: cargo test --workspace

      - name: Build Windows IME (release)
        run: cargo build --release -p cpime-win

  build-android:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate seed lexicon database for Android assets
        run: |
          python tools/init_seed_db.py
          mkdir -p android/app/src/main/assets
          cp core/assets/cpime_dict.db android/app/src/main/assets/cpime_dict.db

      - name: Setup Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Configure Android NDK environment
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
              echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
            elif [ -d "${ANDROID_HOME:-}/ndk" ]; then
              NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -n 1)
              echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
            fi
          fi

      - name: Cross-compile cpime-core JNI libraries (.so)
        working-directory: core
        run: cargo ndk -t arm64-v8a -t x86_64 -o ../android/app/src/main/jniLibs build --release -p cpime-core

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage & Upload Android Debug APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CPIME-Next-Android-debug.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPIME-Next-Android-debug
          path: CPIME-Next-Android-debug.apk
          if-no-files-found: error
