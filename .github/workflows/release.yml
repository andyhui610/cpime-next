name: Release Windows & Android Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-lexicon:
    name: Build Full Lexicon Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies & build full lexicon database
        run: |
          python -m pip install --upgrade pip
          pip install opencc-python-reimplemented -r tools/requirements.txt
          python tools/build_full_lexicon.py

      - name: Upload cpime_dict.db artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpime-dict-db
          path: core/assets/cpime_dict.db
          if-no-files-found: error

  build-windows:
    name: Build & Package Windows IME (x64)
    needs: build-lexicon
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download cpime_dict.db artifact
        uses: actions/download-artifact@v4
        with:
          name: cpime-dict-db
          path: core/assets

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Windows IME (release)
        run: cargo build --release -p cpime-win

      - name: Package CPIME-Next-Windows-x64.zip
        shell: pwsh
        run: |
          $stageDir = "dist"
          $assetsDir = "$stageDir/assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          Copy-Item "target/release/cpime-win.exe" "$stageDir/CPIME-Next.exe" -Force
          Copy-Item "core/assets/cpime_dict.db" "$assetsDir/cpime_dict.db" -Force
          Copy-Item "README.md" "$stageDir/README.md" -Force

          Compress-Archive -Path "$stageDir/CPIME-Next.exe", "$stageDir/assets", "$stageDir/README.md" -DestinationPath "CPIME-Next-Windows-x64.zip" -Force

      - name: Upload Windows portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPIME-Next-Windows-x64
          path: CPIME-Next-Windows-x64.zip
          if-no-files-found: error

  build-android:
    name: Build & Sign Android Universal APK
    needs: build-lexicon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download cpime_dict.db artifact
        uses: actions/download-artifact@v4
        with:
          name: cpime-dict-db
          path: core/assets

      - name: Copy cpime_dict.db to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp core/assets/cpime_dict.db android/app/src/main/assets/cpime_dict.db

      - name: Setup Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Configure Android NDK environment
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
              echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
            elif [ -d "${ANDROID_HOME:-}/ndk" ]; then
              NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -n 1)
              echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
            fi
          fi

      - name: Cross-compile cpime-core JNI libraries (.so)
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release -p cpime-core

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage CPIME-Next-Android-universal.apk
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk CPIME-Next-Android-universal.apk
          else
            APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$APK_FILE" CPIME-Next-Android-universal.apk
          fi

      - name: Upload Android universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPIME-Next-Android-universal
          path: CPIME-Next-Android-universal.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: CPIME-Next-Windows-x64
          path: release-assets

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: CPIME-Next-Android-universal
          path: release-assets

      - name: Publish GitHub Release (Windows ZIP + Android APK)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/CPIME-Next-Windows-x64.zip
            release-assets/CPIME-Next-Android-universal.apk
          generate_release_notes: true
