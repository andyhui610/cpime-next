name: Release Windows & Android Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  package-windows:
    name: Build Full Lexicon & Package Windows IME
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies & build full lexicon database
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          python tools/build_full_lexicon.py

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Windows IME (release)
        run: cargo build --release -p cpime-win

      - name: Assemble portable distribution folder & compress archive
        shell: pwsh
        run: |
          $distDir = "dist/CPIME-Next"
          $assetsDir = "$distDir/assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          Copy-Item "target/release/cpime-win.exe" "$distDir/CPIME-Next.exe" -Force
          Copy-Item "core/assets/cpime_dict.db" "$assetsDir/cpime_dict.db" -Force
          Copy-Item "README.md" "$distDir/README.md" -Force

          Compress-Archive -Path $distDir -DestinationPath "CPIME-Next-Windows-x64.zip" -Force

      - name: Upload Windows portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPIME-Next-Windows-x64
          path: CPIME-Next-Windows-x64.zip
          if-no-files-found: error

  build-android:
    name: Build Full Lexicon & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies & build full lexicon database
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          python tools/build_full_lexicon.py
          mkdir -p android/app/src/main/assets
          cp core/assets/cpime_dict.db android/app/src/main/assets/cpime_dict.db

      - name: Setup Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Configure Android NDK environment
        run: |
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
              echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
            elif [ -d "${ANDROID_HOME:-}/ndk" ]; then
              NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -n 1)
              echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
            fi
          fi

      - name: Cross-compile cpime-core JNI libraries (.so)
        working-directory: core
        run: cargo ndk -t arm64-v8a -t x86_64 -o ../android/app/src/main/jniLibs build --release -p cpime-core

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage Android Debug APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CPIME-Next-Android-debug.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPIME-Next-Android-debug
          path: CPIME-Next-Android-debug.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [package-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows package artifact
        uses: actions/download-artifact@v4
        with:
          name: CPIME-Next-Windows-x64
          path: release-assets

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: CPIME-Next-Android-debug
          path: release-assets

      - name: Publish GitHub Release (Windows ZIP + Android APK)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/CPIME-Next-Windows-x64.zip
            release-assets/CPIME-Next-Android-debug.apk
          generate_release_notes: true
