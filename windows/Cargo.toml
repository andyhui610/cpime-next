[package]
name = "cpime-win"
version = "0.1.0"
edition = "2021"
description = "CPIME-Next Windows Desktop Standalone Overlay IME Frontend"
build = "build.rs"

[build-dependencies]
embed-resource = "3"

[[bin]]
name = "cpime-win"
path = "src/main.rs"

[dependencies]
cpime-core = { path = "../core" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

